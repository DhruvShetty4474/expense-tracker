name: expense_tracker
description: "AI-powered personal finance assistant with smart SMS parsing, Gemini AI insights, and offline-first architecture."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Local Database (Drift / SQLite) ───────────────────────────────────────
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.28

  # ── Firebase ─────────────────────────────────────────────────────────────
  firebase_core: ^3.10.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.4
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  firebase_remote_config: ^5.3.4

  # ── AI ────────────────────────────────────────────────────────────────────
  google_generative_ai: ^0.4.6

  # ── Authentication ────────────────────────────────────────────────────────
  google_sign_in: ^6.2.2

  # ── Security ─────────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  flutter_dotenv: ^5.2.1
  local_auth: ^2.3.0

  # ── Permissions ──────────────────────────────────────────────────────────
  permission_handler: ^11.3.1
  telephony: ^0.2.0

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Charts ────────────────────────────────────────────────────────────────
  fl_chart: ^0.70.0

  # ── Animations ────────────────────────────────────────────────────────────
  lottie: ^3.2.0
  rive: ^0.13.16

  # ── UI Utilities ─────────────────────────────────────────────────────────
  shimmer: ^3.0.0
  intl: ^0.19.0
  cached_network_image: ^3.4.1

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  equatable: ^2.0.7
  connectivity_plus: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/
    - .env
